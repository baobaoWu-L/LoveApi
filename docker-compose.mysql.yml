# Love API - MySQL Compose 配置
# 使用方式:
#   docker compose -f docker-compose.mysql.yml up -d
#   访问 http://服务器IP:3000
#
# 首次登录:
#   访问 http://服务器IP:3000
#   默认账号: root
#   默认密码: 123456
#
# ⚠️ 生产部署前务必修改所有默认密码！

services:
  love-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: love-api
    restart: always
    command: --log-dir /app/logs
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      - SQL_DSN=root:123456@tcp(mysql:3306)/love_api?charset=utf8mb4&parseTime=True&loc=Local
      - REDIS_CONN_STRING=redis://:LoveApi2024@redis:6379
      - TZ=Asia/Shanghai
      - SESSION_SECRET=change-this-to-a-random-string-in-production
      - BATCH_UPDATE_ENABLED=true
    depends_on:
      - redis
      - mysql
    networks:
      - love-api-network

  redis:
    image: redis:7-alpine
    container_name: love-api-redis
    restart: always
    ports:
      - "6379:6379"
    command: ["redis-server", "--requirepass", "LoveApi2024"]
    networks:
      - love-api-network

  mysql:
    image: mysql:8
    container_name: love-api-mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: love_api
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - love-api-network

volumes:
  mysql_data:

networks:
  love-api-network:
    driver: bridge
